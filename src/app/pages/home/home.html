<div class="home-container">
  <!-- 標題 -->
  <header class="home-header">
    <h1>LunaFlow</h1>
    <p class="subtitle">月經週期追蹤</p>
  </header>

  <!-- 預估下一次月經的卡片 -->
  <div class="prediction-card">
    <div class="card-content">
      <p class="prediction-label">預估下一次月經開始日</p>
      <p class="prediction-date">{{ nextPeriodDate }}</p>
      <p class="prediction-hint">基於您的歷史紀錄計算</p>
    </div>
    <div class="card-icon">
      <i class="fas fa-calendar-alt"></i>
    </div>
  </div>

  <!-- 統計信息 -->
  <section class="stats-section">
    <div class="stat-card">
      <i class="fas fa-circle"></i>
      <h3>月經週期</h3>
      <p>約 28 天</p>
    </div>
    <div class="stat-card">
      <i class="fas fa-droplet"></i>
      <h3>月經週期長度</h3>
      <p>5-7 天</p>
    </div>
  </section>

  <!-- 提示區塊 -->
  <div class="tips-section">
    <h2>💡 健康提示</h2>
    <ul class="tips-list">
      <li>保持充足睡眠有助於調節月經週期</li>
      <li>定期記錄月經資訊以了解身體變化</li>
      <li>如週期異常，建議諮詢醫生</li>
    </ul>
  </div>
</div>
